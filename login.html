<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Entrar · Controle de Obrigações Martinelli</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23C74E00'/%3E%3Ctext x='32' y='46' font-size='40' font-weight='700' text-anchor='middle' fill='white' font-family='Arial'%3EG%3C/text%3E%3C/svg%3E"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/assets/css/tokens.css" />
    <link rel="stylesheet" href="/assets/css/base.css" />
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/assets/css/pages.css" />
  </head>
  <body data-pagina="login">
    <section id="login" class="loginbox" hidden>
      <div class="card">
        <div class="brand">
          <div class="mark" aria-hidden="true">G</div>
          <div>
            <h1><span class="nome">ConforCount</span><span class="sub-t">Controle de Obrigações</span></h1>
            <p>Acesso por escritório</p>
          </div>
        </div>
        <form id="cform" method="post" novalidate>
          <p class="steps"><b>Passo 1 de 2</b> · informe o CNPJ do escritório</p>
          <label
            >CNPJ do escritório<input
              id="c-cnpj"
              name="cnpj"
              data-mask="cnpj"
              inputmode="text"
              autocapitalize="characters"
              autocomplete="off"
              maxlength="18"
              placeholder="00.000.000/0000-00"
              required
          /></label>
          <p class="err" id="c-erro" hidden></p>
          <button class="btn primary" type="submit" id="c-btn">Continuar</button>
        </form>
        <form id="lform" method="post" novalidate hidden>
          <p class="steps">
            <b>Passo 2 de 2</b> · escritório <b id="l-cnpj"></b>
            <button type="button" class="lnk" data-act="etapa1">trocar</button>
          </p>
          <label
            >E-mail<input id="l-email" name="email" type="email" autocomplete="username" required
          /></label>
          <label
            >Senha<input id="l-senha" name="senha" type="password" autocomplete="current-password" required
          /></label>
          <p class="err" id="l-erro" hidden></p>
          <button class="btn primary" type="submit" id="l-btn">Entrar</button>
        </form>
      </div>
    </section>

    <div id="modal"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <script defer src="/assets/js/domain/calendario.js"></script>
    <script defer src="/assets/js/domain/cnpj.js"></script>
    <script defer src="/assets/js/domain/obrigacoes.js"></script>
    <script defer src="/assets/js/util.js"></script>
    <script defer src="/assets/js/store.js"></script>
    <script defer src="/assets/js/api.js"></script>
    <script defer src="/assets/js/ui.js"></script>
    <script defer src="/assets/js/auth.js"></script>
    <script defer src="/assets/js/pages/login.js"></script>
  </body>
</html>
